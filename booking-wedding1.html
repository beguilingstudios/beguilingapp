<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Book Wedding Promo 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="topbar">
  <div class="brand-mark">BS</div>
  <div class="brand-copy">
    <div class="brand-name">Beguiling Studios</div>
    <div class="small-label">Bookings</div>
  </div>
</div>
<div class="content">

<a class="back-link" href="wedding.html">&lsaquo; Back</a>
<div class="small-label">Booking Request</div>
<h1>Complete Your Booking</h1>

<div class="summary">
  <strong>Wedding Promo 1</strong>
  <span>R 6,000</span>
</div>

<form action="thank-you.html" method="get">
  <input type="hidden" name="package" value="Wedding Promo 1">
  <input type="hidden" name="price" value="R 6,000">

  <label>Full Name
    <input name="name" type="text" required>
  </label>

  <label>Mobile Number
    <input name="phone" type="tel" required>
  </label>

  <label>Email Address
    <input name="email" type="email">
  </label>

  <label>Event Date
    <input name="date" type="date" required>
  </label>

  <label>Preferred Time
    <input name="time" type="time" required>
  </label>

  <label>Venue / Location
    <input name="venue" type="text" required>
  </label>

  <label>Notes
    <textarea name="notes" placeholder="Anything else we should know?"></textarea>
  </label>

  <button class="submit-button" type="submit">SUBMIT BOOKING REQUEST</button>
</form>

</div>
</body>
</html>
