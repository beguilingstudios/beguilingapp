<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Booking & Invoicing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">BS</div>
      <div class="brand-copy">
        <div class="brand-name">Beguiling Studios</div>
        <div class="small-label">Booking &amp; Invoicing</div>
      </div>
    </div>
  </div>

  <div id="content">
    <div id="page-home" class="page active">
      <div class="home-choice-wrap">
        <div class="small-label">Beguiling Studios</div>
        <h1>What are you booking?</h1>
        <p class="home-intro">Choose an option below to view the available promo packages.</p>

        <button class="promo-choice matric-choice" data-promo="Matric Dance">
          <span class="promo-choice-title">Matric Dance</span>
          <span class="promo-choice-sub">View Matric Dance promo packages</span>
          <span class="promo-arrow">&rsaquo;</span>
        </button>

        <button class="promo-choice wedding-choice" data-promo="Wedding">
          <span class="promo-choice-title">Wedding</span>
          <span class="promo-choice-sub">View Wedding promo packages</span>
          <span class="promo-arrow">&rsaquo;</span>
        </button>
      </div>
    </div>

    <div id="page-promos" class="page">
      <button id="backToHome" class="back-button">&lsaquo; Back</button>
      <div class="small-label">Promo Packages</div>
      <h1 id="promoPageTitle">Packages</h1>
      <p id="promoPageIntro" class="home-intro"></p>
      <div id="promoPackageList"></div>
    </div>

<div id="shade" class="hidden"></div>

  <div id="bookingModal" class="modal hidden">
    <div class="modal-head">
      <h2>Complete Your Booking</h2>
      <button class="close" data-modal="bookingModal">X</button>
    </div>

    <div id="selectedPackageSummary" class="selected-package-box"></div>

    <form id="bookingForm">
      <input id="bookingPackage" type="hidden">
      <input id="bookingAmount" type="hidden">

      <label>Full Name
        <input id="bookingCustomer" type="text" required>
      </label>

      <label>Mobile Number
        <input id="bookingPhone" type="tel" required>
      </label>

      <label>Email Address
        <input id="bookingEmail" type="email">
      </label>

      <label>Event Date
        <input id="bookingDate" type="date" required>
      </label>

      <label>Preferred Time
        <input id="bookingTime" type="time" required>
      </label>

      <label>Venue / Location
        <input id="bookingVenue" type="text" required>
      </label>

      <label>Notes
        <textarea id="bookingNotes" rows="4" placeholder="Anything else we should know?"></textarea>
      </label>

      <button class="blue-button wide" type="submit">SUBMIT BOOKING REQUEST</button>
    </form>
  </div>

<script src="app.js"></script>
</body>
</html>
