<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Personalised Wedding Quote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="topbar">
  <div class="brand-mark">BS</div>
  <div class="brand-copy">
    <div class="brand-name">Beguiling Studios</div>
    <div class="small-label">Bookings</div>
  </div>
</div>
<div class="content">

<a class="back-link" href="wedding.html">&lsaquo; Back</a>
<div class="small-label">Wedding Quote</div>
<h1>Personalised Wedding Quote</h1>
<p class="intro">Tell us what you need and we will prepare a personalised quote.</p>

<form action="thank-you-quote.html" method="get">
  <label>Full Name
    <input name="name" type="text" required>
  </label>

  <label>Mobile Number
    <input name="phone" type="tel" required>
  </label>

  <label>Email Address
    <input name="email" type="email">
  </label>

  <label>Wedding Date
    <input name="date" type="date" required>
  </label>

  <label>Venue / Location
    <input name="venue" type="text" required>
  </label>

  <label>Number of Bridesmaids
    <input name="bridesmaids" type="number" min="0" value="0">
  </label>

  <label>Number of MOB / MOG
    <input name="mothers" type="number" min="0" value="0">
  </label>

  <label>Flower Girl / Granny
    <select name="flower_granny">
      <option>None</option>
      <option>Flower Girl</option>
      <option>Granny</option>
    </select>
  </label>

  <label>What do you need?
    <select name="service">
      <option>Makeup &amp; Hair</option>
      <option>Makeup Only</option>
      <option>Hair Only</option>
    </select>
  </label>

  <label>Additional Information
    <textarea name="notes" placeholder="Tell us anything else about your wedding party or requirements."></textarea>
  </label>

  <button class="submit-button" type="submit">REQUEST MY QUOTE</button>
</form>

</div>
</body>
</html>
